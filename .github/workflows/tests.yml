# Drop into an addon at .github/workflows/tests.yml
#
# Covers the four things the reference analysis found missing most often:
#   1. a real matrix across the range composer.json promises
#   2. the studio's addon-lint as a hard gate
#   3. Pint as a check, not an auto-commit
#   4. a rebuild of committed dist/ that fails on drift
#
# Trim the jobs that do not apply, but do not silently drop the matrix —
# a single-combination run makes the composer constraints a claim nobody verified.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # Statamic 6 requires laravel/framework ^12.40 || ^13.0, so an ^11.0 leg
        # can never resolve. The studio template still carries it; this matrix
        # matches what composer.json actually promises.
        laravel: ['^12.0', '^13.0']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 13 requires PHP ^8.3.
          - php: '8.2'
            laravel: '^13.0'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest
    name: Code style

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      # Check, never fix. Auto-committing style fixes onto a contributor's branch
      # rewrites their work without asking — one reference addon does this; do not copy it.
      - run: vendor/bin/pint --test

  standards:
    runs-on: ubuntu-latest
    name: Addon standards

    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
          # release.versioning reads the repository's tags. actions/checkout
          # fetches none by default, so without this the rule reports a tagged
          # release as untagged — the tool erring, not the addon.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: goldnead/statamic-addon-studio
          path: studio

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run addon-lint
        run: php studio/tools/addon-lint/bin/addon-lint addon --no-color --fail-on=major -v

  # The claims, on engines that can actually disagree about them.
  #
  # Two money paths are guarded by a unique index rather than a row lock, and
  # that was a deliberate choice: `lockForUpdate()` compiles to an empty string
  # on SQLite (`Query\Grammars\SQLiteGrammar::compileLock()`), so a lock proved
  # on the default suite would be a lock nobody had seen work. A unique index is
  # a condition every engine enforces — but "every engine" was an argument, not
  # a measurement, as long as CI only ever ran SQLite.
  #
  # So the same tests run again on MySQL and Postgres. Both services start; the
  # matrix picks which one the suite talks to.
  #
  # **Not the whole suite, and that is measured rather than assumed.** Testbench
  # migrates and rolls back per test, which costs about three seconds on SQLite,
  # twenty on Postgres and two minutes on MySQL for these forty-odd tests — the
  # full 570 would be well over twenty minutes on MySQL for a property none of
  # the other tests are about. What runs here is what the engine actually
  # decides: all three claim tables, the fulfilment claim, the dunning stage
  # claim, and the resolution that keeps one provider's ids out of the
  # other's rows.
  claims:
    runs-on: ubuntu-latest
    name: Claims on ${{ matrix.driver }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            port: 3306
          - driver: pgsql
            port: 5432

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: payments
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -psecret --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_USER: root
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, intl, fileinfo, pdo_mysql, pdo_pgsql
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - name: Run the claim tests
        env:
          DB_CONNECTION: ${{ matrix.driver }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: payments
          DB_USERNAME: root
          DB_PASSWORD: secret
        # `--fail-on-empty-test-suite` because the way this job fails is by
        # going green having run nothing: a renamed class, a typo in the filter,
        # and PHPUnit reports a clean zero. `DatabaseDriverTest` is the other
        # half of the same guard — it asserts the suite really is on the driver
        # the environment asked for, so a `DB_CONNECTION` that stopped reaching
        # the suite is a red job rather than a silent return to SQLite.
        run: >-
          php -d memory_limit=-1 ./vendor/bin/phpunit
          --fail-on-empty-test-suite
          --filter 'StripeWebhookTest|RefundsTest|GatewayRegistryTest|WebhookTrustTest|FulfilmentOnceTest|DatabaseDriverTest|ChargebackTest|DunningTest|AbandonedCheckoutTest'

  analyse:
    runs-on: ubuntu-latest
    name: Static analysis

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: ./vendor/bin/phpstan analyse --no-progress

  dist:
    runs-on: ubuntu-latest
    name: Built assets are current

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # `@statamic/cms` is installed from the vendor directory, so Composer has
      # to run before npm.
      - run: composer install --prefer-dist --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run build

      # The committed bundle is what every installed site loads. A source change
      # that ships without a rebuild leaves the tests green while users run the
      # old screen — a failure with no symptom anyone can trace.
      - name: Fail if dist/ differs from the sources
        run: git diff --exit-code dist
